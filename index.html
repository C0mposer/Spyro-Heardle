<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spyro Heardle</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-layer"></div>
  <div class="gem-particles" id="gemParticles"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="archive.html" class="archive-link">◈ Archive</a>
      </div>
      <h1 class="site-title">
        <span class="title-spyro">Spyro</span>
        <span class="title-heardle">Heardle</span>
      </h1>
      <div class="header-right">
        <a href="stats.html" class="archive-link">Stats ◈</a>
        <span class="day-badge" id="dayBadge">#—</span>
      </div>
    </div>
  </header>

  <main class="game-container">

    <!-- Not Yet Updated -->
    <div id="notUpdated" class="state-panel hidden">
      <div class="dragon-icon">🐉</div>
      <h2>No puzzle today… yet!</h2>
      <p id="notUpdatedMsg"></p>
    </div>

    <!-- Game Panel -->
    <div id="gamePanel">

      <!-- Stem progress track -->
      <div class="stems-bar" id="stemsBar"></div>

      <!-- Audio player -->
      <div class="player-wrap">
        <div class="waveform-display" id="waveformDisplay">
          <div class="waveform-bars" id="waveformBars"></div>
        </div>
        <div class="player-controls">
          <button class="btn-play" id="btnPlay" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="time-display" id="timeDisplay">0:00</span>
          <span class="speedrun-timer hidden" id="speedrunTimer">0.0s</span>
        </div>
        <div class="volume-row">
          <svg class="volume-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1" />
          <svg class="volume-icon volume-icon-loud" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </div>
      </div>

      <!-- Guess area -->
      <div id="guessArea" class="guess-area">
        <div class="autocomplete-wrap">
          <input
            type="text"
            id="guessInput"
            class="guess-input"
            placeholder="Name that tune…"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="autocomplete-list hidden" id="autocompleteList"></div>
        </div>
        <div class="guess-buttons">
          <button class="btn-skip" id="btnSkip">Skip ›</button>
          <button class="btn-submit" id="btnSubmit" disabled>Guess</button>
        </div>
      </div>

      <!-- Result panel (win/lose) -->
      <div id="resultPanel" class="result-panel hidden">
        <div class="result-emoji" id="resultEmoji"></div>
        <h2 class="result-title" id="resultTitle"></h2>
        <p class="result-song" id="resultSong"></p>
        <div class="result-attempts" id="resultAttempts"></div>
        <div class="result-time hidden" id="resultTime">
          <span class="result-time-icon">⏱</span>
          <span class="result-time-value" id="resultTimeValue"></span>
        </div>
        <div class="streak-display hidden" id="streakDisplay">
          <span class="streak-fire">🔥</span>
          <span class="streak-count" id="streakCount"></span>
          <span class="streak-label">day streak</span>
        </div>
        <div class="next-puzzle-countdown">
          <span class="countdown-label">Next puzzle in</span>
          <span class="countdown-timer" id="countdownTimer">—</span>
        </div>
        <button class="btn-share" id="btnShare">Copy Result ◈</button>
        <a class="btn-archive" href="archive.html">View Archive →</a>
      </div>

      <!-- Confetti canvas (full screen, pointer-events none) -->
      <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    </div>
  </main>

  <footer class="site-footer">
    <p>Spyro Heardle — By: Composer</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="game.js"></script>
</body>
</html>
